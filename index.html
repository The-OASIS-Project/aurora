<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>DAWN</title>
      <!-- Critical bootstrap CSS. The stylesheets are imported through main.ts (JS), so
           without this the browser paints the raw static HTML on default white first -
           a FOUC flash. Paint the ground color and hide the unstyled shell on the very
           first frame; main.css reveals #stage once the real styles have applied.
           #000 is a literal here on purpose: it mirrors --ground (pure black by design),
           but the token->CSS-var mirror runs in JS and isn't available on first paint. -->
      <style>
         html,
         body {
            margin: 0;
            height: 100%;
            background: #000;
         }
         #stage {
            visibility: hidden;
         }
         /* Boot cinematic (sequenced in main.ts): hide every chrome overlay from the VERY
            FIRST paint so no panel or item can glimmer before the JS takes over the
            reveal. The canvas (#anchor, the background nebula) is never hidden. This MUST
            be inline: the same rule in main.css loads via JS a frame too late and loses the
            race. Gated to motion-OK so a reduced-motion user - or a JS failure that never
            removes the class - can never be left staring at hidden chrome. */
         @media (prefers-reduced-motion: no-preference) {
            body.boot-intro #stage > *:not(#anchor) {
               opacity: 0;
            }
         }
      </style>
   </head>
   <body class="boot-intro boot-anim">
      <!-- The stage holds everything. The anchor canvas is the one real-WebGL
           element (the center light source, brief S4.4). The field is the
           CSS-3D depth space the DOM panels hover in. Both are painted only by
           the render layer; nothing above it knows these nodes exist. -->
      <div id="stage">
         <canvas id="anchor"></canvas>
         <!-- Reticle framing the reactor (populated by hud.ts). -->
         <div id="reticle"></div>
         <div id="field"></div>

         <!-- Side rails for pinned panels (music, documents, expanded detail).
              Flat (no perspective); the render layer docks pinned nodes here. -->
         <div id="docks">
            <div class="dock-rail left"></div>
            <div class="dock-rail right"></div>
         </div>

         <!-- Bottom console: the single living response (S4.1) and the one
              morphing input bar (S4.3). Voice and text are co-equal inputs. -->
         <div id="console">
            <!-- The conversation surface: a scrollable front window (built by
                 conversation.ts) that recedes into the 3D crawl in the anchor
                 scene when idle. -->
            <div id="convo"></div>
            <!-- The input bar, plus the voice-output (TTS) toggle sitting in the
                 gutter to its left (outside the bar itself). -->
            <div class="composer-row">
               <!-- TTS toggle. A voice-spectrum waveform (echoing the reactor's bar
                    ring): ON shows the tall bars, OFF flatlines to a dotted row.
                    Wired in main.ts to dawn's TTS. -->
               <button
                  type="button"
                  id="composer-tts"
                  class="composer-tts"
                  aria-label="Mute DAWN's voice"
                  aria-pressed="true"
               >
                  <svg class="tts-ico" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
                     <g class="tts-bars-on">
                        <rect x="3.2" y="9.5" width="2.3" height="5" rx="1" />
                        <rect x="7.3" y="5.5" width="2.3" height="13" rx="1" />
                        <rect x="11.4" y="3" width="2.3" height="18" rx="1" />
                        <rect x="15.5" y="7" width="2.3" height="10" rx="1" />
                        <rect x="19.6" y="10.5" width="2.3" height="3" rx="1" />
                     </g>
                     <g class="tts-bars-off">
                        <rect x="3.2" y="10.8" width="2.3" height="2.4" rx="1" />
                        <rect x="7.3" y="10.8" width="2.3" height="2.4" rx="1" />
                        <rect x="11.4" y="10.8" width="2.3" height="2.4" rx="1" />
                        <rect x="15.5" y="10.8" width="2.3" height="2.4" rx="1" />
                        <rect x="19.6" y="10.8" width="2.3" height="2.4" rx="1" />
                     </g>
                  </svg>
               </button>
               <form id="composer" class="composer" autocomplete="off">
                  <span class="panel-corner tl"></span>
                  <span class="panel-corner tr"></span>
                  <span class="panel-corner bl"></span>
                  <span class="panel-corner br"></span>
                  <!-- Hold to speak (push-to-talk); Space/Enter mirror it for the
                       keyboard. The input stays the primary control a keyboard lands on. -->
                  <button
                     type="button"
                     id="composer-mic"
                     class="composer-mic"
                     aria-label="Hold to speak to DAWN"
                     aria-pressed="false"
                  ></button>
                  <!-- Attach a document to the next turn (upload + inline marker). The hidden
                       file input + pending-attachment previews are created in conversation.ts. -->
                  <button
                     type="button"
                     id="composer-attach"
                     class="composer-attach"
                     aria-label="Attach a file"
                     title="Attach a file"
                  >
                     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21.44 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3 3 0 0 1 4.24 4.24l-9.2 9.19a1 1 0 0 1-1.41-1.41l8.49-8.49" />
                     </svg>
                  </button>
                  <input
                     id="composer-input"
                     class="composer-input"
                     type="text"
                     placeholder="Ask DAWN, or speak"
                     aria-label="Message DAWN"
                  />
                  <span class="composer-hint">ENTER</span>
               </form>
            </div>
         </div>

         <!-- Fixed HUD chrome: screen frame, clock, telemetry. Static, not
              state-driven, so it lives outside the render seam. -->
         <div id="hud">
            <span class="frame-corner fc-tl"></span>
            <span class="frame-corner fc-tr"></span>
            <span class="frame-corner fc-bl"></span>
            <span class="frame-corner fc-br"></span>

            <div id="hud-clock">
               <div class="clk-time">--:--:--</div>
               <div class="clk-date">&nbsp;</div>
               <div class="clk-mark">D.A.W.N.</div>
            </div>

            <div id="hud-status">
               <div class="tel-row tel-title"><span class="tel-key">CONVERSATION</span><span class="tel-val" data-tel="title">--</span></div>
               <div class="tel-row"><span class="tel-key">PROVIDER</span><span class="tel-val" data-tel="provider">--</span></div>
               <div class="tel-row tel-model"><span class="tel-key">MODEL</span><span class="tel-val" data-tel="model">--</span></div>
               <div class="tel-row"><span class="tel-key">EFFORT</span><span class="tel-val" data-tel="effort">--</span></div>
               <div class="tel-sep"></div>
               <div class="tel-row"><span class="tel-key">TOKEN RATE</span><span class="tel-val" data-tel="rate">--</span></div>
               <div class="tel-row"><span class="tel-key">TTFT</span><span class="tel-val" data-tel="ttft">--</span></div>
               <div class="tel-row"><span class="tel-key">LATENCY</span><span class="tel-val" data-tel="lat">--</span></div>
               <div class="tel-row"><span class="tel-key">CONTEXT USAGE</span><span class="tel-val" data-tel="ctx">--</span></div>
               <div class="tel-row"><span class="tel-key">UPTIME</span><span class="tel-val" data-tel="up">--:--:--</span></div>
            </div>
         </div>
      </div>
      <script type="module" src="/src/main.ts"></script>
   </body>
</html>
