name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# No job gates another: every result shows on every push.
jobs:
  # -------------------------------------------------------------------------
  # Typecheck: strict TypeScript is how the render seam is enforced ("logic
  # touched a pixel" is a compile error), so it gets its own check.
  # -------------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # -------------------------------------------------------------------------
  # Format check: Prettier (.prettierrc; 3-space indent, 100 columns).
  # -------------------------------------------------------------------------
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  # -------------------------------------------------------------------------
  # Lint: type-aware typescript-eslint, no-unsanitized (no outside value reaches
  # an HTML sink), and the architecture's layer rules (eslint.config.js).
  # -------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # -------------------------------------------------------------------------
  # Source checks: design rules no linter expresses (colors from tokens, DAWN
  # URLs tagged for Aurora's login, no em dashes). Reads the code through
  # TypeScript's parser, so it needs the dependencies installed.
  # -------------------------------------------------------------------------
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Source checks
        run: npm run check:source

  # -------------------------------------------------------------------------
  # Unit tests (vitest; jsdom where a test needs a DOM).
  # -------------------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # -------------------------------------------------------------------------
  # Coverage: the unit tests, instrumented (V8), over Aurora's own code
  # (vitest.config.ts). Pushes to main only, so pull requests don't wait on a
  # second test run. The summary goes on the run's page; the HTML report is an
  # artifact. Reported, not gated.
  # -------------------------------------------------------------------------
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log(["### Unit-test coverage (Aurora code, V8)", "",
              "| | Covered | |", "|---|---|---|",
              ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # -------------------------------------------------------------------------
  # Build: the production bundle DAWN serves (tsc, then vite build to dist/).
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # -------------------------------------------------------------------------
  # Dependency audit: known advisories in what ships to the browser. Dev-only
  # tooling (Vite, Vitest, jsdom) never reaches a user's browser; its advisories
  # come through Dependabot alerts and security updates, and the ones rooted in
  # Vite and Vitest need major upgrades, which are deliberate.
  # -------------------------------------------------------------------------
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
